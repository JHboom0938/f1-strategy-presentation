    function initSlide4Interactive() {
      const lapSlider = document.getElementById('lapSlider');
      const degSlider = document.getElementById('degSlider');
      const lapDisplay = document.getElementById('lapDisplay');
      const degDisplay = document.getElementById('degDisplay');
      const fuelBurnt = document.getElementById('fuelBurnt');

      const tyreDelta = document.getElementById('tyreDelta');
      const netPace = document.getElementById('netPace');
      const simVerdict = document.getElementById('simVerdict');

      function updateCalc() {
        if (!lapSlider || !degSlider) return;
        const lap = parseInt(lapSlider.value);
        const degRate = parseInt(degSlider.value) / 100;

        lapDisplay.textContent = `第 ${lap} 圈`;
        degDisplay.textContent = `${degRate.toFixed(2)} s/圈`;

        // 100kg total fuel over 55 laps -> ~1.82 kg per lap
        const burnt = (lap * 1.82).toFixed(1);
        fuelBurnt.textContent = `${burnt} kg`;

        // Fuel delta: -0.325s per 10kg
        const fDelta = - (burnt / 10 * 0.325);
        fuelDelta.textContent = `${fDelta.toFixed(2)} 秒/圈`;

        // Tyre delta: degRate * lap
        const tDelta = degRate * lap;
        tyreDelta.textContent = `+${tDelta.toFixed(2)} 秒/圈`;

        const net = tDelta + fDelta;
        netPace.textContent = `${net > 0 ? '+' : ''}${net.toFixed(2)} 秒`;

        if (net > 2.0) {
          simVerdict.className = "mt-4 p-2.5 rounded bg-red-950/40 border border-red-800/40 text-[11px] text-red-300 font-mono-code";
          simVerdict.textContent = "🚨 輪胎抓地力完全崩潰！必須立即進站換胎（Cliff Reached / Box Now）！";

      degSlider.addEventListener('input', updateCalc);
